services:
  - type: web
    name: tastebridge
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: openai_compat
      - key: LLM_BASE_URL
        value: https://api.z.ai/api/paas/v4/
      - key: LLM_MODEL
        value: glm-4.7-flash,glm-4.5-flash
      - key: LLM_DISABLE_THINKING
        value: "1"
      - key: LLM_TIMEOUT
        value: "90"
      - key: LLM_RETRIES
        value: "3"
      - key: LLM_API_KEY
        sync: false
      - key: QLOO_API_KEY
        sync: false
